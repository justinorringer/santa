<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coal for Christmas</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="topbar">
      <div class="pill" id="levelName"></div>
      <div class="pill">Wave <b id="wave">0</b>/<b id="waves">0</b></div>
      <div class="pill deliver">
        <span>🎁 Delivered <b id="delivered">0</b>/100</span>
        <div class="bar"><div id="deliverBar"></div></div>
      </div>
      <div class="pill coal"><span class="lump"></span><b id="coal">0</b> coal</div>
      <div class="spacer"></div>
      <button id="speedBtn" class="btn small" title="Game speed">1×</button>
    </div>

    <div id="hint"></div>

    <div id="boss" class="hidden">
      <div class="bossname">SANTA <span id="bossHp"></span></div>
      <div class="bosstrack"><div id="bossFill"></div></div>
    </div>

    <div id="towers"></div>

    <div id="corner">
      <button id="ultBtn" class="round ult hidden">
        <span class="glyph" id="ultGlyph">🎁</span><kbd>Q</kbd>
      </button>
      <button id="playBtn" class="round play" title="Start wave / pause (Space)">
        <svg viewBox="0 0 24 24" class="ico-play"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg viewBox="0 0 24 24" class="ico-pause"><path d="M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z"/></svg>
      </button>
    </div>

    <aside id="panel" class="hidden"></aside>
  </div>

  <div id="paused" class="hidden">PAUSED</div>
  <div id="flash"></div>
  <div id="floats"></div>

  <div id="death" class="hidden">
    <div id="rain"></div>
    <div class="dcard">
      <img id="deathSanta" alt="" />
      <h1>HO HO NO.</h1>
      <p id="deathSub"></p>
      <div class="dstats">
        <div><b id="dsWave">0</b><span>wave reached</span></div>
        <div><b id="dsBroken">0</b><span>presents smashed</span></div>
        <div><b id="dsTowers">0</b><span>gadgets built</span></div>
        <div><b id="dsTime">0</b><span>survived</span></div>
      </div>
      <div class="drow">
        <button id="retryBtn" class="btn big">Try again <kbd>R</kbd></button>
      </div>
    </div>
  </div>

  <div id="cine" class="hidden">
    <div class="bar top"></div>
    <div class="bar bottom"><p id="caption"></p></div>
    <button id="skipBtn" class="btn">Skip <kbd>Esc</kbd></button>
  </div>

  <div id="overlay" class="hidden">
    <div class="card">
      <h1 id="ovTitle"></h1>
      <p id="ovText"></p>
      <div id="ovBtns"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
